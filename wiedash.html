<script>
/* =========================================================
   WIESEL MERCHANT — frontend-only demo (localStorage as DB)
   ========================================================= */

const DB_KEY = 'wiesel_db_v1';
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,9);
const now = () => Date.now();
const money = n => '₦' + Number(n||0).toLocaleString('en-NG', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtDate = t => new Date(t).toLocaleString('en-NG', {dateStyle:'medium', timeStyle:'short'});
const fmtDay = t => new Date(t).toLocaleDateString('en-NG', {month:'short', day:'numeric'});
const initials = s => (s||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function genMerchantId(){
  const seq = String((db.businesses.length||0) + 100001).slice(-6);
  return `WSL-MERCHANT-${seq}`;
}

function normalizeProductImages(product){
  if(!product || !Array.isArray(product.images)) return;
  // Keep only one cover image per product so storage does not fill up.
  product.images = product.images.filter(Boolean).slice(0, 1);
}
function sanitizeBusinessStorage(db){
  if(!db || !Array.isArray(db.businesses)) return db;
  db.businesses.forEach(biz => {
    if(biz && Array.isArray(biz.products)) biz.products.forEach(normalizeProductImages);
  });
  return db;
}
function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(!raw) return { businesses: [], session: null };
  try { return sanitizeBusinessStorage(JSON.parse(raw)); } catch(e){ return { businesses: [], session: null }; }
}
function saveDB(db){
  try { localStorage.setItem(DB_KEY, JSON.stringify(sanitizeBusinessStorage(db))); }
  catch(e){
    if(e && (e.name === 'QuotaExceededError' || String(e).toLowerCase().includes('quota'))){
      throw new Error('Storage limit reached.');
    }
    throw e;
  }
}

function icon(name, cls=''){ return `<i data-lucide="${name}" class="${cls}"></i>`; }
function refreshIcons(){ try{ lucide.createIcons(); }catch(e){} }

async function fileToCompressedDataURL(file, maxSide = 900, quality = 0.62){
  const img = await new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const el = new Image();
    el.onload = () => { URL.revokeObjectURL(url); resolve(el); };
    el.onerror = (err) => { URL.revokeObjectURL(url); reject(err); };
    el.src = url;
  });
  const w = img.naturalWidth || img.width || 1;
  const h = img.naturalHeight || img.height || 1;
  const scale = Math.min(1, maxSide / Math.max(w, h));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(w * scale));
  canvas.height = Math.max(1, Math.round(h * scale));
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  let out = '';
  try { out = canvas.toDataURL('image/webp', quality); }
  catch(e) {}
  if(!out || out.length < 50 || out.startsWith('data:image/png')) out = canvas.toDataURL('image/jpeg', quality);
  return out;
}

let loaderTimer = null;
function showLoader(){
  const el = document.getElementById('topLoader');
  clearTimeout(loaderTimer);
  el.style.transition = 'none';
  el.style.width = '0%';
  el.classList.add('active');
  requestAnimationFrame(()=>{ el.style.transition='width .35s ease, opacity .3s ease'; el.style.width='75%'; });
}
function hideLoader(){
  const el = document.getElementById('topLoader');
  el.style.width = '100%';
  loaderTimer = setTimeout(()=>{ el.classList.remove('active'); el.style.width='0%'; }, 250);
}

function toast(msg, kind='default'){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  const toastKinds = {
    default: { bar:'bg-neutral-800', ic:'info', ic_wrap:'bg-neutral-100 text-neutral-700' },
    success: { bar:'bg-green-600', ic:'check-circle-2', ic_wrap:'bg-green-100 text-green-700' },
    error:   { bar:'bg-red-600',   ic:'alert-circle',  ic_wrap:'bg-red-100 text-red-700' },
    info:    { bar:'bg-blue-600',  ic:'bell',           ic_wrap:'bg-blue-100 text-blue-700' },
  };
  const c = toastKinds[kind] || toastKinds.default;
  el.className = 'toast-item bg-white border border-neutral-200 rounded-xl shadow-lg overflow-hidden relative';
  el.style.animation = 'toastIn .25s cubic-bezier(.2,.8,.3,1) both';
  el.innerHTML = `
    <div class="flex items-start gap-3 px-4 py-3.5">
      <div class="w-7 h-7 rounded-full ${c.ic_wrap} flex items-center justify-center shrink-0">${icon(c.ic,'w-4 h-4')}</div>
      <p class="text-sm font-medium leading-snug pt-0.5">${msg}</p>
      <button onclick="this.closest('.toast-item').remove()" class="ml-auto shrink-0 text-neutral-300 hover:text-neutral-500">${icon('x','w-4 h-4')}</button>
    </div>
    <div class="h-0.5 ${c.bar} toast-bar"></div>`;
  host.appendChild(el);
  refreshIcons();
  setTimeout(()=>{ el.style.transition='opacity .3s, transform .3s'; el.style.opacity='0'; el.style.transform='translateX(8px)'; setTimeout(()=>el.remove(),300); }, 3400);
}

/* ---- custom confirm modal (replaces native confirm()) ---- */
function showConfirm({ title='Are you sure?', message='', confirmText='Confirm', cancelText='Cancel', danger=false, onConfirm }){
  const host = document.getElementById('modalHost');
  host.innerHTML = `
  <div class="fixed inset-0 z-[998] flex items-center justify-center p-4 modal-backdrop" style="background:rgba(10,10,11,.4)">
    <div class="modal-card bg-white rounded-2xl shadow-xl max-w-sm w-full p-6">
      <div class="w-11 h-11 rounded-full flex items-center justify-center mb-4 ${danger?'bg-red-100 text-red-600':'bg-neutral-100 text-neutral-700'}">${icon(danger?'triangle-alert':'help-circle','w-5 h-5')}</div>
      <h3 class="font-display font-bold text-lg">${title}</h3>
      <p class="text-sm text-neutral-500 mt-2">${message}</p>
      <div class="flex gap-2 mt-6">
        <button id="modalCancelBtn" class="flex-1 border border-neutral-300 rounded-lg py-2.5 text-sm font-semibold hover:bg-neutral-50">${cancelText}</button>
        <button id="modalConfirmBtn" class="flex-1 rounded-lg py-2.5 text-sm font-semibold text-white ${danger?'bg-red-600 hover:bg-red-700':'bg-ink hover:bg-neutral-800'}">${confirmText}</button>
      </div>
    </div>
  </div>`;
  refreshIcons();
  document.getElementById('modalCancelBtn').onclick = closeConfirm;
  document.getElementById('modalConfirmBtn').onclick = ()=>{ closeConfirm(); onConfirm && onConfirm(); };
}
function closeConfirm(){ document.getElementById('modalHost').innerHTML=''; }

function newBusiness({email, businessName, password}){
  return {
    id: uid('biz'),
    email, businessName, password,
    slug: businessName.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,20) || uid('store'),
    createdAt: now(),
    profile: { address:'', phone:'', ownerName:'', industry:'', logo:'', openHour:'', closeHour:'' },
    bank: { bankName:'', accountNumber:'', accountName:'', otpAttempts:0, locked:false },
    branding: { active:true, bannerText:'Welcome to our store — quality you can trust.', primary:'#0A0A0B', secondary:'#16A34A' },
    products: [],
    orders: [],
    messages: [],
    staff: [],
    auditLog: [],
    notes: {},
    onboardingDismissed: false,
  };
}

function onboardingSteps(biz){
  const p = biz.profile;
  return [
    { key:'identity', label:'Business name & email confirmed', done:true, hint:'Done at signup', route:'#/profile' },
    { key:'contact', label:'Address, phone & owner name', done: !!(p.address && p.phone && p.ownerName), hint:'Business Profile', route:'#/dashboard/profile' },
    { key:'products', label:'Add at least 5 products', done: biz.products.length>=5, hint:`${biz.products.length}/5 added`, route:'#/dashboard/products' },
    { key:'bank', label:'Set up payout bank account', done: !!(biz.bank.bankName && biz.bank.accountNumber), hint:'Finance', route:'#/dashboard/finance' },
    { key:'hours', label:'Opening & closing hours', done: !!(p.openHour && p.closeHour), hint:'Business Profile', route:'#/dashboard/profile' },
    { key:'branding', label:'Logo & brand colors', done: !!p.logo && biz.branding.primary!=='' , hint:'Branding', route:'#/dashboard/branding' },
  ];
}
function onboardingComplete(biz){ return onboardingSteps(biz).every(s=>s.done); }

function staffCan(biz, pageKey){
  if(!state.staffId) return true; // owner has full access
  const staff = biz.staff.find(s=>s.id===state.staffId);
  if(!staff) return false;
  if(pageKey==='overview') return true; // everyone can see overview
  return (staff.pages||[]).includes(pageKey);
}
function logAction(biz, text){
  const actor = state.staffId ? (biz.staff.find(s=>s.id===state.staffId)?.name || 'Staff') : (biz.profile.ownerName || 'Owner');
  biz.auditLog.unshift({ id: uid('log'), actor, text, at: now() });
  biz.auditLog = biz.auditLog.slice(0,100);
}

/* ---------------- App State ---------------- */
let db = loadDB();
let state = { route: location.hash || '#/auth', bizId: db.session?.bizId || null, staffId: db.session?.staffId || null, loggingOut:false, showLogoutConfirm:false };

function currentBiz(){ return db.businesses.find(b=>b.id===state.bizId); }
function persistAndRender(){ saveDB(db); render(); }

function goTo(hash){
  // Keep state.route in sync even when the current hash is already the target.
  state.route = hash;
  if(location.hash === hash){ render(); }
  else { location.hash = hash; }
}
function login(bizId, staffId=null){
  state.bizId = bizId; state.staffId = staffId;
  db.session = { bizId, staffId };
  saveDB(db);
  goTo('#/dashboard/overview');
}
function requestLogout(){
  const biz = currentBiz();
  showConfirm({
    title: 'Logout now?',
    message: 'Are you sure the merchant wants to log out of this dashboard?',
    confirmText: 'Logout',
    cancelText: 'Cancel',
    danger: true,
    onConfirm: performLogout
  });
}
function performLogout(){
  state.loggingOut = true;
  render();
  showLoader();
  requestAnimationFrame(()=>{
    const biz = currentBiz();
    if(biz){ logAction(biz, 'Logged out'); saveDB(db); }
    state.bizId = null;
    state.staffId = null;
    db.session = null;
    saveDB(db);
    goTo('#/auth');
    state.loggingOut = false;
    hideLoader();
  });
}

window.addEventListener('hashchange', ()=>{ state.route = location.hash; render(); });

/* ================= AUTH VIEWS ================= */
function viewAuth(){
  const mode = state.authMode || 'signup';
  return `
  <div class="min-h-screen grid lg:grid-cols-2">
    <div class="hidden lg:flex flex-col justify-between bg-ink text-white p-12 relative overflow-hidden">
      <div class="relative z-10">
        <div class="font-display text-2xl font-bold tracking-tight">Wiesel</div>
        <p class="text-white/50 text-sm mt-1">Merchant Console</p>
      </div>
      <div class="relative z-10 max-w-sm">
        <p class="font-display text-3xl leading-snug">Set up your store once. Sell everywhere, every day.</p>
        <p class="text-white/50 text-sm mt-4">Onboarding takes about ten minutes — address, five products, and a payout account, then you're ready for sale.</p>
      </div>
      <div class="relative z-10 text-white/30 text-xs font-mono">Wiesel.com/store/your-business</div>
      <div class="absolute -right-24 -bottom-24 w-96 h-96 rounded-full border border-white/10"></div>
      <div class="absolute -right-10 -bottom-40 w-96 h-96 rounded-full border border-white/10"></div>
    </div>
    <div class="flex items-center justify-center p-6 sm:p-12">
      <div class="w-full max-w-sm">
        <div class="lg:hidden font-display text-xl font-bold mb-8">Wiesel</div>
        <div class="flex gap-1 mb-8 bg-neutral-200/60 p-1 rounded-lg w-fit text-sm font-medium">
          <button onclick="setAuthMode('signup')" class="px-4 py-1.5 rounded-md transition ${mode==='signup'?'bg-white shadow text-ink':'text-neutral-500'}">Create store</button>
          <button onclick="setAuthMode('login')" class="px-4 py-1.5 rounded-md transition ${mode==='login'?'bg-white shadow text-ink':'text-neutral-500'}">Log in</button>
        </div>
        ${mode==='signup' ? signupForm() : loginForm()}
        <p class="text-xs text-neutral-400 mt-6">Staff members log in from inside the dashboard once the store owner has signed in on this device.</p>

}

function signupForm(){
  return `
  <form onsubmit="return doSignup(event)" class="space-y-4">
    <h1 class="font-display text-2xl font-bold mb-1">Create your store</h1>
    <p class="text-sm text-neutral-500 mb-6">Frontend demo — everything is saved to this browser's local storage.</p>
    <div>
      <label class="text-xs font-semibold text-neutral-600">Business name</label>
      <input name="businessName" required class="mt-1 w-full border border-neutral-300 rounded-lg px-3 py-2.5 text-sm" placeholder="Vikky Fabrics">
    </div>
    <div>
      <label class="text-xs font-semibold text-neutral-600">Business email</label>
      <input name="email" type="email" required class="mt-1 w-full border border-neutral-300 rounded-lg px-3 py-2.5 text-sm" placeholder="you@business.com">
    </div>
    <div>
      <label class="text-xs font-semibold text-neutral-600">Confirm business email</label>
      <input name="confirmEmail" type="email" required class="mt-1 w-full border border-neutral-300 rounded-lg px-3 py-2.5 text-sm" placeholder="you@business.com">
    </div>
    <div>
      <label class="text-xs font-semibold text-neutral-600">Set password</label>
      <input name="password" type="password" required minlength="6" class="mt-1 w-full border border-neutral-300 rounded-lg px-3 py-2.5 text-sm" placeholder="Minimum 6 characters">
    </div>
    <button class="w-full bg-ink text-white rounded-lg py-2.5 text-sm font-semibold hover:bg-neutral-800 transition mt-2">Create store account</button>
  </form>`;
}
function loginForm(){
  return `
  <form onsubmit="return doLogin(event)" class="space-y-4">
    <h1 class="font-display text-2xl font-bold mb-1">Welcome back</h1>
    <p class="text-sm text-neutral-500 mb-6">Log in to your merchant dashboard.</p>
    <div>
      <label class="text-xs font-semibold text-neutral-600">Business email</label>
      <input name="email" type="email" required class="mt-1 w-full border border-neutral-300 rounded-lg px-3 py-2.5 text-sm">
    </div>
    <div>
      <label class="text-xs font-semibold text-neutral-600">Password</label>
      <input name="password" type="password" required class="mt-1 w-full border border-neutral-300 rounded-lg px-3 py-2.5 text-sm">
    </div>
    <button class="w-full bg-ink text-white rounded-lg py-2.5 text-sm font-semibold hover:bg-neutral-800 transition mt-2">Log in</button>
  </form>`;
}
function setAuthMode(m){ state.authMode = m; render(); }

function doSignup(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const email = f.get('email').trim().toLowerCase();
  const businessName = f.get('businessName').trim();
  if(email !== f.get('confirmEmail').trim().toLowerCase()){ toast('Business emails do not match', 'error'); return false; }
  if(db.businesses.some(b=>b.email===email)){ toast('An account with this email already exists', 'error'); return false; }
  if(db.businesses.some(b=>b.businessName.trim().toLowerCase()===businessName.toLowerCase())){ toast('That business name is already taken. Please choose a unique name.', 'error'); return false; }
  const biz = newBusiness({ email, businessName, password: f.get('password') });
  biz.merchantId = genMerchantId();
  logAction(biz, 'Store account created');
  db.businesses.push(biz);
  saveDB(db);
  toast('Store created. Let us finish setting it up.', 'success');
  login(biz.id);
  return false;
}
function doLogin(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const email = f.get('email').trim().toLowerCase();
  const biz = db.businesses.find(b=>b.email===email);
  if(!biz || biz.password !== f.get('password')){ toast('Incorrect email or password', 'error'); return false; }
  logAction(biz, 'Logged in'); saveDB(db);
  login(biz.id);
  return false;
}
/* Staff login from WITHIN the dashboard (business already known via session) */
function staffLoginFromDashboard(e){
  e.preventDefault();
  const biz = currentBiz();
  const f = new FormData(e.target);
  const staff = biz.staff.find(s=>s.email===f.get('email').trim().toLowerCase());
  if(!staff || staff.password !== f.get('password')){ toast('Incorrect staff email or password', 'error'); return false; }
  if(staff.disabled){ toast('This staff account is disabled', 'error'); return false; }
  logAction(biz, `${staff.name} logged in`);
  state.staffId = staff.id;
  db.session = { bizId: biz.id, staffId: staff.id };
  saveDB(db);
  toast(`Signed in as ${staff.name}`, 'success');
  state.showStaffSwitcher = false;
  goTo('#/dashboard/overview');
  return false;
}

const NAV = [
  { key:'overview', label:'Overview', icon:'layout-dashboard' },
  { key:'messages', label:'Messages', icon:'message-circle' },
  { key:'sales', label:'Sales', icon:'trending-up' },
  { key:'orders', label:'Orders', icon:'package' },
  { key:'finance', label:'Finance', icon:'wallet' },
  { key:'customers', label:'Customers', icon:'users' },

  const pageMap = {
    overview: pageOverview, messages: pageMessages, sales: pageSales, orders: pageOrders,
    finance: pageFinance, customers: pageCustomers, branding: pageBranding, products: pageProducts,
    profile: pageProfile, staff: pageStaff,
  };
  const pageFn = pageMap[seg] || pageOverview;
  const allowed = staffCan(biz, seg);

  return `
  <div class="min-h-screen flex dashboard-shell">
    <aside class="w-60 shrink-0 bg-ink text-white flex flex-col h-screen sticky top-0">
      <div class="px-5 py-5 border-b border-white/10 shrink-0">
        <div class="font-display text-lg font-bold sidebar-label">Wiesel Commerce</div>
        <div class="text-white/40 text-xs mt-0.5 truncate sidebar-business">${biz.businessName}</div>
      </div>
      <div class="px-5 py-3 shrink-0 sidebar-status">
        <span class="text-xs font-medium inline-flex items-center ${complete?'text-green-400':'text-amber-400'}">
          <span class="inline-block w-1.5 h-1.5 rounded-full mr-1.5 ${complete?'bg-green-400':'bg-amber-400'}"></span>${complete?'Ready for sale':'Setting up'}
        </span>
      </div>
      <nav class="flex-1 px-3 space-y-0.5 min-h-0">
        ${visibleNav.map(n=>`
          <a href="#/dashboard/${n.key}" class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-[13px] font-medium text-white/70 hover:bg-white/5 transition ${seg===n.key?'active':''}" title="${n.label}">
            <span class="w-4 text-center opacity-80">${icon(n.icon,'w-[15px] h-[15px]')}</span><span class="sidebar-nav-label">${n.label}</span>
          </a>`).join('')}
      </nav>
      <div class="px-3 py-3 border-t border-white/10 shrink-0">
        ${staffUser
          ? `<div class="px-2 pb-2 flex items-center gap-2 text-xs text-white/50 sidebar-account">
               <div class="w-6 h-6 rounded-full bg-white/10 flex items-center justify-center text-[10px] font-semibold text-white">${initials(staffUser.name)}</div>
               <div class="truncate"><span class="text-white/80 font-medium">${staffUser.name}</span><br><span class="text-[10px]">Staff account</span></div>

               ${icon('users','w-[15px] h-[15px] opacity-80')}<span class="sidebar-switch-text">Switch to staff</span>
             </button>`}
        <button onclick="requestLogout()" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-[13px] font-medium text-white/70 hover:bg-white/5 transition" title="Logout">
          ${icon('log-out','w-[15px] h-[15px] opacity-80')}<span class="sidebar-logout-text">Logout</span>
        </button>
      </div>
    </aside>
    <main class="flex-1 min-w-0 overflow-y-auto h-screen">

/* ---------- switch back to owner: password gate ---------- */
function openSwitchToOwner(){ state.showOwnerSwitchBack = true; render(); }
function closeSwitchToOwner(){ state.showOwnerSwitchBack = false; render(); }
function ownerSwitchBackModal(biz){
  return `
  <div class="fixed inset-0 z-[997] flex items-center justify-center p-4 modal-backdrop" style="background:rgba(10,10,11,.4)" onclick="if(event.target===this) closeSwitchToOwner()">

      <div class="flex items-center justify-between mb-1">
        <h3 class="font-display font-bold text-lg">Confirm it's you</h3>
        <button onclick="closeSwitchToOwner()" class="text-neutral-400 hover:text-ink">${icon('x','w-4 h-4')}</button>
      </div>
      <p class="text-sm text-neutral-500 mb-5">For security, enter the store owner's password to switch back.</p>
      <form onsubmit="return confirmSwitchBackToOwner(event)" class="space-y-3">
        <input name="password" type="password" required autofocus placeholder="Owner password" class="w-full border border-neutral-300 rounded-lg px-3 py-2.5 text-sm">
        <button class="w-full bg-ink text-white rounded-lg py-2.5 text-sm font-semibold">Switch back to owner</button>
      </form>
    </div>
  </div>`;
}
function confirmSwitchBackToOwner(e){
  e.preventDefault();
  const biz = currentBiz();
  const pass = new FormData(e.target).get('password');
  if(pass !== biz.password){ toast('Incorrect owner password', 'error'); return false; }
  logAction(biz, `Switched back to owner`);
  state.staffId = null;
  state.showOwnerSwitchBack = false;
  db.session = { bizId: biz.id, staffId: null };
  saveDB(db);
  toast('Switched back to owner', 'success');
  goTo('#/dashboard/overview');
  return false;
}

/* ================= OVERVIEW ================= */

function salesBarChartHTML(days){
  const max = Math.max(1, ...days.map(d=>d.total));
  const width = 760;
  const height = 300;
  const padX = 44;
  const padTop = 28;
  const padBottom = 54;
  const chartH = height - padTop - padBottom;
  const chartW = width - padX * 2;
  const gap = 18;
  const barW = (chartW - gap * (days.length - 1)) / days.length;
  const yTicks = [0, Math.ceil(max / 2), max];
  const yPos = v => padTop + chartH - (v / max) * chartH;
  return `
  <div class="overflow-x-auto relative">
    <div id="chartTooltip" class="pointer-events-none absolute z-20 opacity-0 transition-all duration-150 ease-out bg-ink text-white rounded-lg px-3 py-2 shadow-xl" style="transform:translate(-50%,-100%) scale(.96); left:0; top:0;">
      <div id="chartTooltipLabel" class="text-[10px] text-white/60 font-medium"></div>
      <div id="chartTooltipValue" class="font-semibold text-sm font-mono"></div>
    </div>
    <svg viewBox="0 0 ${width} ${height}" class="w-full h-auto block">
      <defs>
        <linearGradient id="wieselBar" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#111827"/>
          <stop offset="100%" stop-color="#0A0A0B"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="${width}" height="${height}" rx="20" fill="#ffffff"></rect>
      ${yTicks.map(v => `
        <line x1="${padX}" x2="${width - padX}" y1="${yPos(v)}" y2="${yPos(v)}" stroke="#E5E7EB" stroke-width="1"></line>
        <text x="${padX - 10}" y="${yPos(v) + 4}" text-anchor="end" class="fill-neutral-400" font-size="11" font-family="Inter, sans-serif">${v === 0 ? '₦0' : money(v)}</text>
      `).join('')}
      ${days.map((d, i) => {
        const x = padX + i * (barW + gap);
        const barH = max ? (d.total / max) * chartH : 0;
        const y = padTop + chartH - barH;
        const barId = 'bar_' + i;
        return `
          <g style="cursor:pointer" onmousemove="showChartTooltip(event, ${JSON.stringify(d.label)}, ${JSON.stringify(money(d.total))})" onmouseleave="hideChartTooltip()">
            <rect x="${x}" y="${padTop}" width="${barW}" height="${chartH}" fill="transparent"></rect>
            <rect id="${barId}" x="${x}" y="${y}" width="${barW}" height="${Math.max(barH, 3)}" rx="12" fill="url(#wieselBar)" style="transition: transform .18s cubic-bezier(.2,.8,.3,1), opacity .18s ease, filter .18s ease; transform-origin:${x + barW/2}px ${padTop+chartH}px;" onmouseenter="this.style.transform='scaleY(1.015)'; this.style.filter='drop-shadow(0 6px 10px rgba(0,0,0,.18))'; this.setAttribute('fill','url(#wieselBarHover)')" onmouseleave="this.style.transform='scaleY(1)'; this.style.filter='none'; this.setAttribute('fill','url(#wieselBar)')"></rect>
          </g>
          <text x="${x + barW / 2}" y="${height - 28}" text-anchor="middle" class="fill-neutral-500" font-size="11" font-family="Inter, sans-serif">${d.label}</text>
          <text x="${x + barW / 2}" y="${y - 8}" text-anchor="middle" class="fill-neutral-900" font-size="11" font-family="JetBrains Mono, monospace">${money(d.total)}</text>
        `;
      }).join('')}
      <defs>
        <linearGradient id="wieselBarHover" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#1F2937"/>
          <stop offset="100%" stop-color="#16A34A"/>
        </linearGradient>
      </defs>
      <line x1="${padX}" x2="${width - padX}" y1="${padTop + chartH}" y2="${padTop + chartH}" stroke="#D1D5DB" stroke-width="1.2"></line>
    </svg>
  </div>`;
}
function showChartTooltip(evt, label, value){
  const tip = document.getElementById('chartTooltip');
  if(!tip) return;
  document.getElementById('chartTooltipLabel').textContent = label;
  document.getElementById('chartTooltipValue').textContent = value;
  const wrap = tip.parentElement;
  const rect = wrap.getBoundingClientRect();
  const x = evt.clientX - rect.left;
  const y = evt.clientY - rect.top;
  tip.style.left = x + 'px';
  tip.style.top = (y - 14) + 'px';
  tip.style.opacity = '1';
  tip.style.transform = 'translate(-50%,-100%) scale(1)';
}
function hideChartTooltip(){
  const tip = document.getElementById('chartTooltip');
  if(!tip) return;
  tip.style.opacity = '0';
  tip.style.transform = 'translate(-50%,-100%) scale(.96)';
}

  biz.messages.slice(0,5).forEach(m=> items.push({ at:m.lastAt, icon:'message-circle', text:`Message from ${m.customerName}` }));

}
function toggleNotifPanel(e){ e.stopPropagation(); state.showNotifPanel = !state.showNotifPanel; state.showNotesPanel = false; render(); }
function toggleNotesPanel(e){ e.stopPropagation(); state.showNotesPanel = !state.showNotesPanel; state.showNotifPanel = false; render(); }
function notifPanelHTML(biz){

  <div class="fade-in absolute right-0 top-11 w-80 bg-white border border-neutral-200 rounded-xl shadow-xl z-30 overflow-hidden" onclick="event.stopPropagation()">
    <div class="px-4 py-3 border-b border-neutral-100 flex items-center justify-between">
      <p class="text-sm font-semibold">Notifications</p>
      <button onclick="state.showNotifPanel=false;render()" class="text-neutral-400 hover:text-ink">${icon('x','w-3.5 h-3.5')}</button>
    </div>
    <div class="max-h-80 overflow-y-auto">
      ${items.length? items.map(n=>`
        <div class="px-4 py-3 border-b border-neutral-50 last:border-0 flex gap-3 items-start hover:bg-neutral-50">
          <div class="w-7 h-7 rounded-full bg-neutral-100 text-neutral-500 flex items-center justify-center shrink-0">${icon(n.icon,'w-3.5 h-3.5')}</div>
          <div class="min-w-0"><p class="text-xs font-medium leading-snug">${n.text}</p><p class="text-[10px] text-neutral-400 mt-0.5">${fmtDate(n.at)}</p></div>
        </div>`).join('') : `<div class="px-4 py-8 text-center text-xs text-neutral-400">No notifications yet</div>`}
    </div>
  </div>`;
}
function currentNoteOwnerKey(){ return state.staffId || 'owner'; }
function currentNoteOwnerLabel(biz){
  if(state.staffId){ const s = biz.staff.find(x=>x.id===state.staffId); return s ? s.name : 'Staff'; }
  return biz.profile.ownerName || 'Owner';
}
function getMyNotes(biz){
  biz.notes = biz.notes || {};
  const key = currentNoteOwnerKey();
  biz.notes[key] = biz.notes[key] || [];
  return biz.notes[key];
}
function notesPanelHTML(biz){
  const notes = getMyNotes(biz).slice().sort((a,b)=>b.at-a.at);
  return `
  <div class="fade-in absolute right-0 top-11 w-80 bg-white border border-neutral-200 rounded-xl shadow-xl z-30 overflow-hidden" onclick="event.stopPropagation()">
    <div class="px-4 py-3 border-b border-neutral-100 flex items-center justify-between">
      <div><p class="text-sm font-semibold">My notes</p><p class="text-[10px] text-neutral-400">Only visible to ${currentNoteOwnerLabel(biz)}</p></div>
      <button onclick="state.showNotesPanel=false;render()" class="text-neutral-400 hover:text-ink">${icon('x','w-3.5 h-3.5')}</button>
    </div>
    <form onsubmit="return addNote(event)" class="p-3 border-b border-neutral-100">
      <textarea name="note" rows="2" required placeholder="e.g. Delivery to Mr James was unsuccessful, he'll be available in store for pickup on Saturday evening" class="w-full border border-neutral-300 rounded-lg px-3 py-2 text-xs resize-none"></textarea>
      <button class="mt-2 text-xs font-semibold bg-ink text-white rounded-full px-3 py-1.5">Add note</button>
    </form>
    <div class="max-h-64 overflow-y-auto">
      ${notes.length? notes.map(n=>`
        <div class="px-4 py-3 border-b border-neutral-50 last:border-0 group">
          <div class="flex justify-between gap-2">
            <p class="text-xs leading-snug whitespace-pre-wrap flex-1">${n.text}</p>
            <button onclick="deleteNote('${n.id}')" class="text-neutral-300 hover:text-red-600 shrink-0">${icon('x','w-3 h-3')}</button>
          </div>
          <p class="text-[10px] text-neutral-400 mt-1">${fmtDate(n.at)}</p>
        </div>`).join('') : `<div class="px-4 py-8 text-center text-xs text-neutral-400">No notes yet</div>`}
    </div>
  </div>`;
}
function addNote(e){
  e.preventDefault();
  const biz = currentBiz();
  const text = new FormData(e.target).get('note').trim();
  if(!text) return false;
  getMyNotes(biz).unshift({ id: uid('note'), text, at: now() });
  persistAndRender();
  return false;
}
function deleteNote(id){
  const biz = currentBiz();
  const key = currentNoteOwnerKey();
  biz.notes[key] = (biz.notes[key]||[]).filter(n=>n.id!==id);
  persistAndRender();
}
document.addEventListener('click', ()=>{
  if(state.showNotifPanel || state.showNotesPanel){ state.showNotifPanel=false; state.showNotesPanel=false; render(); }
});

function pageOverview(biz){
  const steps = onboardingSteps(biz);
  const doneCount = steps.filter(s=>s.done).length;
  const pct = Math.round(doneCount/steps.length*100);
  const showChecklist = !onboardingComplete(biz) || !biz.onboardingDismissed===false && !onboardingComplete(biz);

  const checklistBlock = !onboardingComplete(biz) ? `
  <div class="border border-neutral-200 rounded-xl bg-white overflow-hidden mb-8">
    <div class="flex">
      <div class="p-6 flex-1">
        <div class="flex items-center justify-between mb-1">
          <div class="font-mono text-xs text-neutral-400">SETUP TICKET · ${biz.merchantId || biz.id}</div>
          <div class="font-mono text-xs text-neutral-400">${doneCount}/${steps.length} complete</div>
        </div>
        <h2 class="font-display text-xl font-bold mb-1">Finish setting up ${biz.businessName}</h2>
        <p class="text-sm text-neutral-500 mb-5">Complete every step below to activate your online store for customers.</p>
        <div class="w-full h-1.5 bg-neutral-100 rounded-full overflow-hidden mb-6">
          <div class="h-full bg-green-600 transition-all" style="width:${pct}%"></div>
        </div>
        <ul class="space-y-1">
          ${steps.map(s=>`
            <li class="flex items-center gap-3 py-2 ${s.done?'opacity-50':''}">
              <span class="w-5 h-5 rounded-full flex items-center justify-center shrink-0 ${s.done?'bg-green-600 text-white':'border-2 border-neutral-300'}">${s.done?icon('check','w-3 h-3'):''}</span>
              <span class="text-sm font-medium flex-1 ${s.done?'strike':''}">${s.label}</span>
              <span class="text-xs text-neutral-400 font-mono">${s.hint}</span>
              ${!s.done?`<a href="${s.route}" class="text-xs font-semibold text-ink border border-neutral-300 rounded-full px-3 py-1 hover:bg-neutral-100 whitespace-nowrap inline-flex items-center gap-1">Go ${icon('arrow-right','w-3 h-3')}</a>`:''}
            </li>`).join('')}
        </ul>
      </div>
    </div>
  </div>` : `
  <div class="border border-green-200 bg-green-50 rounded-xl p-5 mb-8 flex items-center gap-3">
    <span class="text-green-600">${icon('check-circle-2','w-5 h-5')}</span>
    <div><p class="font-semibold text-green-800 text-sm">Your store is ready for sale</p><p class="text-xs text-green-700/80">Customers can now find and buy from ${biz.businessName} at Wiesel.com/store/${biz.slug}</p></div>
  </div>`;

  const completedOrders = biz.orders.filter(o=>o.status==='completed');
  const today = new Date(); today.setHours(0,0,0,0);
  const salesToday = completedOrders.filter(o=>o.paidAt>=today.getTime());
  const revenueToday = salesToday.reduce((a,o)=>a+o.total,0);
  const totalRevenue = completedOrders.reduce((a,o)=>a+o.total,0);
  const days = [...Array(7)].map((_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-(6-i)); d.setHours(0,0,0,0);
    const next = d.getTime()+86400000;
    const total = completedOrders.filter(o=>o.paidAt>=d.getTime() && o.paidAt<next).reduce((a,o)=>a+o.total,0);
    return { label: fmtDay(d.getTime()), total };
  });
  const max = Math.max(1, ...days.map(d=>d.total));

  return `
  ${pageHeader('Overview', 'Store performance at a glance.', overviewHeaderIcons(biz))}
  ${checklistBlock}
  <div class="grid sm:grid-cols-3 gap-4 mb-6">
    ${statCard('Orders today', salesToday.length, 'package')}
    ${statCard('Revenue today', money(revenueToday), 'trending-up')}
    ${statCard('All-time revenue', money(totalRevenue), 'wallet')}
  </div>
  <div class="grid lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 bg-white border border-neutral-200 rounded-xl p-6">

/* ---------- voice note recording ---------- */
let mediaRecorder = null;
let audioChunks = [];
let recordingStream = null;
let recordingThreadId = null;
// Prefer codecs that decode cleanly and consistently across Chrome/Android/desktop.
// Leaving this to the browser default is what causes the garbled "wave" playback on some devices.
const VOICE_MIME_CANDIDATES = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
function pickVoiceMimeType(){
  if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  return VOICE_MIME_CANDIDATES.find(m => { try{ return MediaRecorder.isTypeSupported(m); } catch(e){ return false; } }) || '';
}
async function toggleVoiceRecording(threadId){
  if(state.recording){ stopVoiceRecording(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Voice recording is not supported in this browser', 'error'); return; }
  try{
    // echoCancellation/noiseSuppression prevent the feedback/whine sound some devices produce otherwise
    recordingStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch(err){
    toast('Microphone access was denied', 'error');
    return;
  }
  audioChunks = [];
  recordingThreadId = threadId;
  const chosenMime = pickVoiceMimeType();
  try{ mediaRecorder = chosenMime ? new MediaRecorder(recordingStream, { mimeType: chosenMime }) : new MediaRecorder(recordingStream); }
  catch(err){
    try{ mediaRecorder = new MediaRecorder(recordingStream); }
    catch(err2){ toast('Could not start recording on this device', 'error'); recordingStream.getTracks().forEach(t=>t.stop()); return; }
  }
  mediaRecorder.ondataavailable = ev => { if(ev.data && ev.data.size) audioChunks.push(ev.data); };
  mediaRecorder.onstop = async () => {
    recordingStream.getTracks().forEach(t=>t.stop());
    const biz = currentBiz();
    const m = biz.messages.find(x=>x.id===recordingThreadId);
    const pendingId = state.pendingVoiceId;
    state.pendingVoiceId = null;
    if(audioChunks.length===0){
      if(m && pendingId){ m.chat = m.chat.filter(c=>c.id!==pendingId); persistAndRender(); }
      return;
    }
    try{
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || chosenMime || 'audio/webm' });
      const dataUrl = await blobToDataURL(blob);
      if(m && pendingId){
        const idx = m.chat.findIndex(c=>c.id===pendingId);
        if(idx>-1) m.chat[idx] = { from:'store', type:'audio', audioUrl: dataUrl, at: now() };
        m.lastAt = now();
        logAction(biz, `Sent a voice note to ${m.customerName}`);
      }
      toast('Voice note sent', 'success');
      persistAndRender();
    } catch(err){
      console.error('Voice note failed to finalize', err);
      if(m && pendingId){ m.chat = m.chat.filter(c=>c.id!==pendingId); }
      toast('Voice note failed to send — please try again', 'error');
      persistAndRender();
    }
  };
  mediaRecorder.start();
  state.recording = true;
  toast('Recording…', 'info');
  render();
}
function stopVoiceRecording(){
  state.recording = false;
  if(mediaRecorder && mediaRecorder.state !== 'inactive'){
    // Show an instant "sending" bubble the moment the user hits stop, rather than waiting
    // on the async blob encode — this is what makes it feel instant instead of delayed.
    const biz = currentBiz();
    const m = biz.messages.find(x=>x.id===recordingThreadId);
    if(m){
      const pendingId = uid('pending');
      state.pendingVoiceId = pendingId;
      m.chat.push({ id: pendingId, from:'store', type:'audio-pending', at: now() });
      m.lastAt = now();
    }
    persistAndRender();
    mediaRecorder.stop();
  } else {
    render();
  }
}
function blobToDataURL(blob){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

/* ---------- reliable cross-platform file save (fixes mobile downloads) ---------- */
// Plain <a download> data-URI clicks are unreliable on mobile Safari/Chrome-Android for
// large files. This tries the native share sheet first (best on mobile), then falls back
// to a real Blob object URL (works far more reliably than a data URI), then a new-tab open.
async function shareOrDownloadBlob(blob, filename, mime){
  try{
    if(navigator.canShare && window.File){
      const file = new File([blob], filename, { type: mime });
      if(navigator.canShare({ files:[file] })){
        await navigator.share({ files:[file], title: filename });
        return true;
      }
    }
  } catch(err){ /* user cancelled share or unsupported — fall through to download */ }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 8000);
    return true;
  } catch(err){
    try{ window.open(URL.createObjectURL(blob), '_blank'); return true; }
    catch(err2){ console.error('Download failed entirely', err2); return false; }
  }
}
async function openChatAttachment(el){
  const dataUrl = el.getAttribute('data-attachment-url');
  const filename = el.getAttribute('data-attachment-name') || 'attachment.pdf';
  const oldLabel = el.innerHTML;
  el.innerHTML = `<span class="spinner"></span> Opening…`;
  try{
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const ok = await shareOrDownloadBlob(blob, filename, blob.type || 'application/pdf');
    if(!ok) toast('Could not open this attachment on this device', 'error');
  } catch(err){
    console.error('openChatAttachment failed', err);
    toast('Could not open this attachment', 'error');
  } finally {
    el.innerHTML = oldLabel;
  }
}
function buildReceiptPDF(biz, o){
  const pdfLib = window.jspdf && window.jspdf.jsPDF ? window.jspdf.jsPDF : null;
  if(!pdfLib) return null;
  const lineH = 18;
  const headerH = 118;
  const itemsH = o.items.length * lineH + 40;
  const footerH = 70;
  const pageH = headerH + itemsH + footerH;
  const pageW = 320;
  const doc = new pdfLib({ unit:'pt', format:[pageW, pageH] });
  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.text(biz.businessName || 'Store', pageW/2, 34, { align:'center' });
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);

async function generateReceipt(id){

/* ---------- flyer / demo QR generation (no third-party calls) ---------- */
// EDIT ME: put your Wiesel logo image here (a hosted URL or a base64 data URI both work).
// Leave it as '' to keep the "Powered by Wiesel" text fallback.
const WIESEL_LOGO_URL = '';
function hashStr(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hexToRgb(hex){
  const m = String(hex || '').replace('#','').trim();
  const full = m.length === 3 ? m.split('').map(ch=>ch+ch).join('') : m;
  const n = parseInt(full || '0', 16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function mixHex(a, b, t){
  const A = hexToRgb(a), B = hexToRgb(b);
  const mix = (x,y)=>Math.round(x + (y-x)*t);
  return `rgb(${mix(A.r,B.r)}, ${mix(A.g,B.g)}, ${mix(A.b,B.b)})`;
}
function loadCanvasImage(src){
  return new Promise((resolve, reject)=>{
    if(!src) return reject(new Error('No image'));
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
// Draws a deterministic, premium-looking demo QR pattern (visual only, not a real encoder).
function drawDemoQR(ctx, x, y, size, seedText, fg, bg){
  const modules = 25;
  const cell = size / modules;
  ctx.fillStyle = bg; ctx.fillRect(x, y, size, size);
  const rand = mulberry32(hashStr(seedText));
  const grid = [];
  for(let r=0;r<modules;r++){ grid[r] = []; for(let c=0;c<modules;c++){ grid[r][c] = rand() > 0.52 ? 1 : 0; } }
  function finder(cx, cy){
    for(let r=-3;r<=3;r++) for(let c=-3;c<=3;c++){
      const rr=cy+r, cc=cx+c; if(rr<0||cc<0||rr>=modules||cc>=modules) continue;
      const ring = Math.max(Math.abs(r),Math.abs(c));
      grid[rr][cc] = (ring===3||ring===1) ? 0 : 1;
    }
  }
  finder(3,3); finder(modules-4,3); finder(3,modules-4);
  ctx.fillStyle = fg;
  for(let r=0;r<modules;r++) for(let c=0;c<modules;c++){
    if(grid[r][c]) ctx.fillRect(x + c*cell, y + r*cell, cell*0.94, cell*0.94);
  }
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function drawPin(ctx, x, y, size, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = color;
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.lineWidth = Math.max(2, size * 0.11);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // Lucide-style map pin outline
  ctx.beginPath();
  ctx.moveTo(0, size * 0.46);
  ctx.bezierCurveTo(-size * 0.34, size * 0.18, -size * 0.33, -size * 0.16, 0, -size * 0.18);
  ctx.bezierCurveTo(size * 0.33, -size * 0.16, size * 0.34, size * 0.18, 0, size * 0.46);
  ctx.closePath();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, -size * 0.01, size * 0.18, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}
function wrapCenteredText(ctx, text, cx, y, maxWidth, lineHeight, maxLines){
  if(!text) return;
  const words = text.split(/\s+/);
  let line = '', lines = [];
  for(const w of words){
    const test = line ? line+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
    if(lines.length >= maxLines) break;
  }
  if(line && lines.length < maxLines) lines.push(line);
  if(lines.length === maxLines && words.join(' ') !== lines.join(' ')){
    let last = lines[maxLines-1];
    while(ctx.measureText(last+'…').width > maxWidth && last.length>1) last = last.slice(0,-1);
    lines[maxLines-1] = last + '…';
  }
  lines.forEach((l,i)=> ctx.fillText(l, cx, y + i*lineHeight));
}
async function buildFlyerCanvas(biz, scale=1){
  const W = 1240 * scale, H = 1748 * scale;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const primary = biz.branding.primary || '#0A0A0B';
  const secondary = biz.branding.secondary || '#16A34A';
  const panelDark = mixHex(primary, '#08090C', 0.76);
  const panelMid = mixHex(primary, '#111318', 0.58);
  const textSoft = '#E5E7EB';

  // background
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, mixHex(primary, '#030303', 0.86));
  bg.addColorStop(0.42, mixHex(primary, '#0E1014', 0.88));
  bg.addColorStop(1, '#050506');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // premium diagonal panels
  ctx.save();
  ctx.globalAlpha = 0.82;
  ctx.fillStyle = panelDark;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.02);
  ctx.lineTo(W * 0.68, 0);
  ctx.lineTo(W * 0.82, H * 0.24);
  ctx.lineTo(W * 0.08, H * 0.28);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.65;
  const glow = ctx.createRadialGradient(W * 0.22, H * 0.16, 10, W * 0.22, H * 0.16, W * 0.42);
  glow.addColorStop(0, mixHex(secondary, '#ffffff', 0.16));
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // subtle shopping icons pattern
  const pattern = ['🛒', '🛍️', '📦', '🏷️'];
  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  for(let y = 110 * scale; y < H; y += 210 * scale){
    for(let x = 120 * scale; x < W; x += 210 * scale){
      const glyph = pattern[(Math.floor(x / 10) + Math.floor(y / 10)) % pattern.length];
      ctx.font = `900 ${74 * scale}px Inter, sans-serif`;
      ctx.fillText(glyph, x, y);
    }
  }
  ctx.restore();

  // top content card
  const cardX = 44 * scale, cardY = 40 * scale, cardW = W - 88 * scale, cardH = H * 0.24;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  roundRect(ctx, cardX, cardY, cardW, cardH, 40 * scale);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1.2 * scale;
  roundRect(ctx, cardX, cardY, cardW, cardH, 40 * scale);
  ctx.stroke();
  ctx.restore();

  // accent strip
  ctx.fillStyle = secondary;
  roundRect(ctx, 62 * scale, cardY + 24 * scale, 12 * scale, cardH - 48 * scale, 8 * scale);
  ctx.fill();

  // brand name, beautifully centered in the card
  const upperName = biz.businessName || 'Wiesel Store';
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  let nameSize = 104 * scale;
  ctx.font = `900 ${nameSize}px 'Space Grotesk', sans-serif`;
  while(ctx.measureText(upperName).width > W * 0.78 && nameSize > 42 * scale){
    nameSize -= 2 * scale;
    ctx.font = `900 ${nameSize}px 'Space Grotesk', sans-serif`;
  }
  const nameY = cardY + cardH * 0.44;
  ctx.fillText(upperName, W / 2, nameY);

  // address line with location pin, directly beneath the brand name
  const address = (biz.profile?.address || 'Store address not set');
  const locY = nameY + 62 * scale;
  ctx.font = `600 ${26 * scale}px 'Inter', sans-serif`;
  const addrWidth = ctx.measureText(address).width;
  const total = addrWidth + 36 * scale;
  const startX = W / 2 - total / 2;
  drawPin(ctx, startX + 14 * scale, locY - 7 * scale, 24 * scale, secondary);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#E5E7EB';
  ctx.fillText(address, startX + 34 * scale, locY);

  // QR display card
  const qrSize = W * 0.42;
  const qrX = (W - qrSize) / 2;
  const qrY = H * 0.355;
  ctx.save();
  const qrCard = ctx.createLinearGradient(qrX, qrY - 18 * scale, qrX + qrSize, qrY + qrSize + 24 * scale);
  qrCard.addColorStop(0, 'rgba(255,255,255,0.10)');
  qrCard.addColorStop(1, 'rgba(255,255,255,0.04)');
  ctx.fillStyle = qrCard;
  roundRect(ctx, qrX - 26 * scale, qrY - 34 * scale, qrSize + 52 * scale, qrSize + 68 * scale, 36 * scale);
  ctx.fill();
  ctx.strokeStyle = secondary;
  ctx.lineWidth = 2.5 * scale;
  roundRect(ctx, qrX - 26 * scale, qrY - 34 * scale, qrSize + 52 * scale, qrSize + 68 * scale, 36 * scale);
  ctx.stroke();
  ctx.restore();

  drawDemoQR(ctx, qrX, qrY, qrSize, `${biz.slug}-${biz.merchantId || biz.id}`, '#FFFFFF', mixHex(primary, '#080808', 0.9));

  const badge = qrSize * 0.22;
  const bx = qrX + (qrSize - badge) / 2;
  const by = qrY + (qrSize - badge) / 2;
  ctx.save();
  const badgeGlow = ctx.createRadialGradient(W / 2, qrY + qrSize / 2, 4, W / 2, qrY + qrSize / 2, badge * 1.6);
  badgeGlow.addColorStop(0, mixHex(secondary, '#ffffff', 0.12));
  badgeGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = badgeGlow;
  ctx.fillRect(qrX, qrY, qrSize, qrSize);
  ctx.fillStyle = panelMid;
  roundRect(ctx, bx, by, badge, badge, badge / 2);
  ctx.fill();
  ctx.strokeStyle = secondary;
  ctx.lineWidth = 2.8 * scale;
  roundRect(ctx, bx, by, badge, badge, badge / 2);
  ctx.stroke();

  let drewLogo = false;
  const logoSrc = biz.profile?.logo;
  if(logoSrc){
    try{
      const img = await loadCanvasImage(logoSrc);
      ctx.save();
      ctx.beginPath();
      ctx.arc(W / 2, qrY + qrSize / 2, badge * 0.38, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, W / 2 - badge * 0.38, qrY + qrSize / 2 - badge * 0.38, badge * 0.76, badge * 0.76);
      ctx.restore();
      drewLogo = true;
    } catch(e){}
  }
  if(!drewLogo){
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `900 ${26 * scale}px 'Space Grotesk', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(initials(biz.businessName), W / 2, qrY + qrSize / 2 + 10 * scale);
  }
  ctx.restore();

  // CTA block
  let cy = qrY + qrSize + 110 * scale;
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  ctx.font = `900 ${60 * scale}px 'Space Grotesk', sans-serif`;
  ctx.fillText('Scan to shop', W / 2, cy);

  cy += 66 * scale;
  ctx.fillStyle = textSoft;
  ctx.font = `700 ${30 * scale}px 'Inter', sans-serif`;
  ctx.fillText('Open your store instantly and browse products', W / 2, cy);

  cy += 56 * scale;
  ctx.fillStyle = secondary;
  ctx.font = `900 ${42 * scale}px 'Space Grotesk', sans-serif`;
  ctx.fillText(biz.businessName || 'Wiesel Store', W / 2, cy);

  // footer glow + tiny badges
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 2 * scale;
  ctx.beginPath();
  ctx.moveTo(W * 0.14, H * 0.92);
  ctx.lineTo(W * 0.86, H * 0.92);
  ctx.stroke();
  // "Powered by Wiesel" logo mark — set WIESEL_LOGO_URL below to your logo image
  // (a URL or a base64 data URI both work). Falls back to text if it isn't set or fails to load.
  let drewFooterLogo = false;
  if(WIESEL_LOGO_URL){
    try{
      const logoImg = await loadCanvasImage('https://veecdex.github.io/trin001/WIESEL LOGO.png');
      const logoH = 44 * scale;
      const logoW = logoH * (logoImg.naturalWidth / logoImg.naturalHeight || 3);
      ctx.drawImage(logoImg, W/2 - logoW/2, H * 0.958 - logoH/2, logoW, logoH);
      drewFooterLogo = true;
    } catch(e){ /* fall back to text below */ }
  }
  if(!drewFooterLogo){
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `700 ${26 * scale}px 'Inter', sans-serif`;
    ctx.fillText('Powered by Wiesel', W / 2, H * 0.958);
  }
  ctx.restore();

  return canvas;
}

function canvasToBlob(canvas, type='image/png', quality=1.0){
  return new Promise((resolve)=> canvas.toBlob(b=>resolve(b), type, quality));
}
async function downloadFlyer(){
  const biz = currentBiz();
  if(!biz) return;
  const btn = document.querySelector('[data-flyer-download-btn]');
  const oldLabel = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Preparing…`; }
  try{
    const canvas = await buildFlyerCanvas(biz, 3);
    const pdfLib = window.jspdf && window.jspdf.jsPDF ? window.jspdf.jsPDF : null;
    if(pdfLib){
      // canvas.toBlob (not toDataURL) avoids the giant-string failures that break downloads on mobile
      const pngBlob = await canvasToBlob(canvas, 'image/png', 1.0);
      if(!pngBlob){ toast('Could not render the flyer image', 'error'); return; }
      const imgData = await blobToDataURL(pngBlob);
      const pdf = new pdfLib({ orientation: 'portrait', unit: 'pt', format: [595.28, 841.89], compress: true });
      pdf.addImage(imgData, 'PNG', 0, 0, 595.28, 841.89);
      const pdfBlob = pdf.output('blob');
      const ok = await shareOrDownloadBlob(pdfBlob, `${biz.slug || 'store'}-wiesel-flyer.pdf`, 'application/pdf');
      toast(ok ? 'Flyer ready — check your downloads or share sheet' : 'Could not save the flyer on this device', ok ? 'success' : 'error');
      return;
    }
    const pngBlob = await canvasToBlob(canvas, 'image/png', 1.0);
    if(!pngBlob){ toast('Could not render the flyer image', 'error'); return; }
    const ok = await shareOrDownloadBlob(pngBlob, `${biz.slug || 'store'}-wiesel-flyer.png`, 'image/png');
    toast(ok ? 'Flyer image ready' : 'Could not save the flyer on this device', ok ? 'success' : 'error');
  } catch(err){
    console.error('downloadFlyer failed', err);
    toast('Something went wrong generating the flyer', 'error');
  } finally {
    if(btn){ btn.disabled = false; btn.innerHTML = oldLabel; }
  }
}

function calcFees(price){
  const gross = Number(price||0);
  const platformFee = gross * 0.02;
  const vatOnFee = platformFee * 0.075;
  const processorFee = Math.min(gross * 0.015 + (gross > 2500 ? 100 : 0), 2000);
  const totalFees = platformFee + vatOnFee + processorFee;
  return { gross, platformFee, vatOnFee, processorFee, totalFees, net: Math.max(0, gross - totalFees) };
}

function saveProduct(e, id){
  e.preventDefault();
  const biz = currentBiz(); const f = new FormData(e.target);
  // Save only the cover image to keep storage usage small and stable.
  const images = (state.tempImages||[]).filter(Boolean).slice(0, 1);
  if(images.length===0){ toast('Add at least 1 product photo', 'error'); return false; }
  const category = f.get('category');
  if(!category){ toast('Select or create a category for this product', 'error'); return false; }
  const btn = document.getElementById('saveProductBtn');
  const oldLabel = btn?.innerHTML || '';
  if(btn){ btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Saving...`; }
  try{
    const data = { name: f.get('name'), price: parseFloat(f.get('price')), description: f.get('description'), available: f.get('available')==='on', images, category };
    if(id){ Object.assign(biz.products.find(p=>p.id===id), data); logAction(biz, `Updated product "${data.name}"`); }
    else { biz.products.push({ id: uid('prod'), ...data }); logAction(biz, `Added product "${data.name}"`); }
    sanitizeBusinessStorage(db);
    saveDB(db);
    toast('Product saved', 'success');
    state.editingProduct = null;
    state.tempImages = null;
    const mount = document.getElementById('productFormMount');
    if(mount) mount.innerHTML = '';
    const grid = document.getElementById('productGrid');
    if(grid) grid.innerHTML = productGridHTML(biz);
    refreshIcons();
    render();
    return false;
  } catch(err){
    // If the browser is already near quota, trim existing stored product images and retry once.
    try{
      sanitizeBusinessStorage(db);
      saveDB(db);
      toast('Storage was tight, so the product image was optimized and saved.', 'info');
      state.editingProduct = null;
      state.tempImages = null;
      render();
    } catch(e2){
      toast('Images storage is full. Remove some older products or use fewer product photos.', 'error');
    }
  } finally {
    if(btn){ btn.disabled = false; btn.innerHTML = oldLabel || 'Save product'; }
  }
  return false;
}

  document.getElementById('logoDataInput').value = dataUrl;
  const preview = document.getElementById('logoPreview');
  if(preview) preview.innerHTML = `<img src="${dataUrl}" class="w-16 h-16 rounded-lg object-cover mt-2 border border-neutral-200">`;
}
function saveProfile(e){
  e.preventDefault();
  const biz = currentBiz(); const f = new FormData(e.target);
  Object.assign(biz.profile, {
    ownerName: f.get('ownerName'), industry: f.get('industry'), phone: f.get('phone'),
    address: f.get('address'), openHour: f.get('openHour'), closeHour: f.get('closeHour'),
    logo: document.getElementById('logoDataInput').value,
  });
  logAction(biz, 'Updated business profile');
  toast('Profile saved', 'success');
  state.profileEditing = false;
  persistAndRender();
  return false;
}
function deleteAccount(){
  const biz = currentBiz();
  showConfirm({
    title: 'Delete this store account?',
    message: 'This permanently deletes your store, products, orders and staff. This cannot be undone.',
    confirmText: 'Delete account', danger: true,
    onConfirm(){
      db.businesses = db.businesses.filter(b=>b.id!==biz.id);
      db.session = null; state.bizId = null; state.staffId = null;
      saveDB(db);
      toast('Account deleted', 'info');
      location.hash = '#/auth';
    }
  });
}

/* ================= STAFF ================= */
const ASSIGNABLE_PAGES = NAV.filter(n=>n.key!=='overview');

function pageAccessCheckboxes(checkedPages=[]){
  return `<div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
    ${ASSIGNABLE_PAGES.map(n=>`
      <label class="flex items-center gap-2 text-xs border border-neutral-200 rounded-lg px-2.5 py-2 hover:bg-neutral-50 cursor-pointer">
        <input type="checkbox" name="pages" value="${n.key}" ${checkedPages.includes(n.key)?'checked':''}>
        ${n.label}
      </label>`).join('')}
  </div>`;
}

function pageStaff(biz){
  const isOwner = !state.staffId;
  return `
  ${pageHeader('Staff', 'Employee accounts, page access, and an audit log of dashboard activity.', isOwner?`<button onclick="state.addingStaff=!state.addingStaff;render()" class="text-xs font-semibold bg-ink text-white rounded-full px-4 py-2 inline-flex items-center gap-1.5">${icon('plus','w-3.5 h-3.5')}Add staff</button>`:'')}
  ${state.addingStaff && isOwner ? card(`<form onsubmit="return addStaff(event)" class="p-6 mb-6">
    <div class="grid sm:grid-cols-3 gap-4">
      <input name="name" required placeholder="Full name" class="border border-neutral-300 rounded-lg px-3 py-2.5 text-sm">
      <input name="email" type="email" required placeholder="Staff email" class="border border-neutral-300 rounded-lg px-3 py-2.5 text-sm">
      <input name="password" required minlength="4" placeholder="Temporary password" class="border border-neutral-300 rounded-lg px-3 py-2.5 text-sm">
    </div>
    <div class="mt-4">
      <label class="text-xs font-semibold text-neutral-600 mb-2 block">Page access — choose what this employee can open. Overview is always visible.</label>
      ${pageAccessCheckboxes()}
    </div>
    <div class="mt-4"><button class="bg-ink text-white rounded-lg px-4 py-2 text-sm font-semibold">Create staff account</button></div>
  </form>`, 'mb-6') : ''}
  <div class="grid lg:grid-cols-2 gap-6">
    ${card(`<div class="p-5">
      <h3 class="font-semibold text-sm mb-4">Team (${biz.staff.length})</h3>
      ${biz.staff.length? `<ul class="space-y-4 max-h-[520px] overflow-y-auto pr-2">${biz.staff.map(s=>`
        <li class="border border-neutral-100 rounded-lg p-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-neutral-100 text-xs flex items-center justify-center font-semibold shrink-0">${initials(s.name)}</div>
            <div><p class="text-sm font-medium">${s.name}</p><p class="text-xs text-neutral-400">${s.email}</p></div></div>
            ${isOwner?`<div class="flex items-center gap-2 shrink-0">
              <button onclick="toggleEditAccess('${s.id}')" class="text-xs font-semibold border border-neutral-300 rounded-full px-2.5 py-1 hover:bg-neutral-100">Access</button>
              <button onclick="removeStaff('${s.id}')" class="text-xs text-red-600 font-semibold border border-red-200 rounded-full px-2.5 py-1 hover:bg-red-50">Remove</button>
            </div>`:''}
          </div>
          <div class="flex flex-wrap gap-1 mt-2.5">
            ${(s.pages&&s.pages.length) ? s.pages.map(k=>`<span class="text-[10px] font-medium bg-neutral-100 text-neutral-600 rounded-full px-2 py-0.5">${(NAV.find(n=>n.key===k)||{}).label||k}</span>`).join('') : `<span class="text-[10px] text-neutral-400">Overview only</span>`}
          </div>
          ${state.editingStaffAccess===s.id ? `
          <form onsubmit="return saveStaffAccess(event,'${s.id}')" class="mt-3 pt-3 border-t border-neutral-100">
            ${pageAccessCheckboxes(s.pages||[])}
            <div class="flex gap-2 mt-3">
              <button class="text-xs font-semibold bg-ink text-white rounded-full px-3 py-1.5">Save access</button>
              <button type="button" onclick="toggleEditAccess('${s.id}')" class="text-xs text-neutral-500">Cancel</button>
            </div>
          </form>` : ''}
        </li>`).join('')}</ul>` : `<p class="text-sm text-neutral-400">No staff added yet</p>`}
    </div>`)}
    ${card(`<div class="p-5">
      <h3 class="font-semibold text-sm mb-4">Audit log</h3>
      ${biz.auditLog.length? `<ul class="space-y-3 max-h-96 overflow-y-auto">${biz.auditLog.map(l=>`
        <li class="text-sm border-b border-neutral-100 pb-2 last:border-0"><span class="font-medium">${l.actor}</span> <span class="text-neutral-500">${l.text}</span><div class="text-xs text-neutral-400 font-mono">${fmtDate(l.at)}</div></li>`).join('')}</ul>` : emptyState('No activity yet')}
    </div>`)}
  </div>`;
}
function addStaff(e){
  e.preventDefault(); const biz = currentBiz(); const f = new FormData(e.target);
  const pages = f.getAll('pages');
  biz.staff.push({ id: uid('staff'), name: f.get('name'), email: f.get('email').toLowerCase(), password: f.get('password'), disabled:false, pages });
  logAction(biz, `Added staff member "${f.get('name')}" with access to ${pages.length} page(s)`);
  toast('Staff account created', 'success');
  state.addingStaff = false;
  persistAndRender();
  return false;
}
function toggleEditAccess(id){ state.editingStaffAccess = state.editingStaffAccess===id ? null : id; render(); }
function saveStaffAccess(e, id){
  e.preventDefault();
  const biz = currentBiz(); const s = biz.staff.find(x=>x.id===id);
  s.pages = new FormData(e.target).getAll('pages');
  logAction(biz, `Updated page access for "${s.name}"`);
  toast('Access updated', 'success');
  state.editingStaffAccess = null;
  persistAndRender();
  return false;
}
function removeStaff(id){
  const biz = currentBiz(); const s = biz.staff.find(x=>x.id===id);
  showConfirm({
    title: 'Remove staff member?',
    message: `${s.name} will lose access to the dashboard immediately.`,
    confirmText: 'Remove', danger: true,
    onConfirm(){
      biz.staff = biz.staff.filter(x=>x.id!==id);
      if(state.staffId===id){ state.staffId=null; db.session={bizId:biz.id, staffId:null}; }
      logAction(biz, `Removed staff member "${s.name}"`);
      toast('Staff member removed', 'success');
      persistAndRender();
    }
  });
}

/* ================= DEMO DATA ================= */
function seedDemoData(){
  const biz = currentBiz();
  if(biz.products.length===0){
    biz.categories = biz.categories || [];
    const sample = [
      {name:'Ankara Wrap Dress', price:18500, description:'Handmade ankara wrap dress, one size fits most.', category:'Dresses'},
      {name:'Beaded Clutch Bag', price:9500, description:'Hand-beaded evening clutch.', category:'Bags'},
      {name:'Kente Head Wrap', price:6000, description:'Woven kente-style head wrap.', category:'Accessories'},
      {name:'Adire Kaftan', price:21000, description:'Tie-dye adire kaftan, breathable cotton.', category:'Kaftans'},
      {name:'Gele Set (3-piece)', price:14000, description:'Pre-styled gele set, three colors.', category:'Accessories'},
    ];
    sample.forEach(s=>{
      if(!biz.categories.includes(s.category)) biz.categories.push(s.category);
      biz.products.push({ id: uid('prod'), ...s, available:true, images:['https://placehold.co/300x300/0A0A0B/FFFFFF?text='+encodeURIComponent(s.name.split(' ')[0])] });
    });
  }
  biz.profile.address = biz.profile.address || '14 Allen Avenue, Ikeja, Lagos';
  biz.profile.phone = biz.profile.phone || '08012345678';
  biz.profile.ownerName = biz.profile.ownerName || 'Victoria Adeyemi';
  biz.profile.openHour = biz.profile.openHour || '09:00';
  biz.profile.closeHour = biz.profile.closeHour || '19:00';
  biz.profile.logo = biz.profile.logo || 'https://placehold.co/200x200/0A0A0B/FFFFFF?text=VF';
  biz.bank.bankName = biz.bank.bankName || 'GTBank';
  biz.bank.accountNumber = biz.bank.accountNumber || '0123456789';
  biz.bank.accountName = biz.bank.accountName || biz.businessName;
  for(let i=0;i<4;i++) simulateOrderSilent(biz);
  simulateMessageSilent(biz);
  logAction(biz, 'Loaded sample data');
  toast('Sample data loaded', 'success');
  persistAndRender();
}
function simulateOrderSilent(biz){
  const names = ['Adaeze Okonkwo','Tunde Bakare','Chiamaka Eze','Ibrahim Sule'];
  const chosen = [...biz.products].sort(()=>0.5-Math.random()).slice(0,1+Math.floor(Math.random()*3));
  const items = chosen.map(p=>({name:p.name, price:p.price, qty:1+Math.floor(Math.random()*2)}));
  const total = items.reduce((a,i)=>a+i.price*i.qty,0);
  const daysAgo = Math.floor(Math.random()*6);
  const t = now() - daysAgo*86400000;
  const completed = Math.random() > 0.25;
  biz.orders.unshift({ id: uid('ord'), customerName: names[Math.floor(Math.random()*names.length)], customerPhone:'080'+Math.floor(10000000+Math.random()*89999999),
    items, total, status: completed?'completed':'pending', createdAt:t, paidAt: completed?t:null, deliveryCode: Math.random().toString(36).slice(2,10).toUpperCase() });
}
function simulateMessageSilent(biz){
  biz.messages.push({ id: uid('msg'), customerName:'Adaeze Okonkwo', lastAt: now(), chat:[{from:'customer', type:'text', text:'Hi, is the Ankara dress still available in medium?', at: now()}] });
}

/* ================= CONNECTIVITY GUARD ================= */
function renderConnectivityBanner(){
  const el = document.getElementById('offlineBanner');
  if(!el) return;
  if(navigator.onLine){
    el.classList.add('hidden');
    document.body.classList.remove('is-offline');
  } else {
    el.classList.remove('hidden');
    document.body.classList.add('is-offline');
  }
}
window.addEventListener('online', ()=>{ renderConnectivityBanner(); toast('Back online', 'success'); });
window.addEventListener('offline', ()=>{ renderConnectivityBanner(); toast('You are offline', 'error'); });

/* ================= ROUTER / RENDER ================= */
function render(){
  showLoader();
  const root = document.getElementById('root');
  const route = location.hash || '#/auth';
  try{
    if(route.startsWith('#/dashboard')){
      if(!state.bizId){ location.hash = '#/auth'; return; }
      root.innerHTML = viewDashboard();
    } else {
      root.innerHTML = viewAuth();
    }
    refreshIcons();
    renderConnectivityBanner();
    if(route.startsWith('#/dashboard') && (state.route.split('/')[2]||'overview')==='branding'){
      renderFlyerPreview();
    }
  } catch(err){
    console.error('Render error:', err);
    root.innerHTML = `<div class="min-h-screen flex items-center justify-center p-6"><div class="max-w-md w-full bg-white border border-red-200 rounded-2xl p-6"><h1 class="font-display text-xl font-bold">Something broke while loading this page</h1><p class="text-sm text-neutral-500 mt-2">Check the console for the exact error. The dashboard shell was protected so the loader will not get stuck.</p></div></div>`;
    toast('A page crashed while rendering. Check console.', 'error');
  } finally {
    hideLoader();
  }
}
if(state.bizId && !location.hash.startsWith('#/dashboard')) location.hash = '#/dashboard/overview';
if(db && db.businesses) sanitizeBusinessStorage(db);
render();
</script>
